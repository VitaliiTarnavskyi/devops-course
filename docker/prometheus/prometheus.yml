global:
  scrape_interval: 10s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8080']
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']