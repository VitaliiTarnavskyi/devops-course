version: "3.9"

services:
  backend:
    container_name: backend-devops-course
    image: backend-devops-course:latest
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    restart: always
    volumes:
      - ../backend:/var/www/backend
    ports:
      - "8081:8080"
    environment:
      - REDIS_ENDPOINT=redis
      - REDIS_PORT=6379
      - DB_ENDPOINT=postgres
      - DB_PORT=5432
      - DB_NAME=db
      - DB_PASS=secret
      - DB_USER=devops

  postgres:
    image: postgres:14-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=devops
      - POSTGRES_DB=devops

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  frontend:
    container_name: frontend-devops-course
    image: frontend-devops-course:latest
    entrypoint: [ "sh", "/usr/local/bin/entrypoint.sh" ]
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
    restart: always
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080
    volumes:
      - ../frontend:/var/www/frontend
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana
    ports:
      - "3200:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/image:/var/lib/docker/image:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - /var/log:/var/log
      - /etc/machine-id:/etc/machine-id
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki

volumes:
  alertmanager-data:
  grafana-storage:
