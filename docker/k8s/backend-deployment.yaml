apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: vitaliitarnavskyi/backend-devops-course:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_ENDPOINT
              value: postgres
            - name: DB_NAME
              value: db
            - name: DB_PASS
              value: secret
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: devops
            - name: REDIS_ENDPOINT
              value: redis
            - name: REDIS_PORT
              value: "6379"
      restartPolicy: Always
