      creationTimestamp: null
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: DB_ENDPOINT
              value: postgres
            - name: DB_NAME
              value: db
            - name: DB_PASS
              value: secret
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: devops
            - name: REDIS_ENDPOINT
              value: redis
            - name: REDIS_PORT
