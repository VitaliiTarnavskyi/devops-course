services:
  backend:
    container_name: backend-devops-course
    image: backend-devops-course:latest
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    restart: always
    volumes:
      - ../backend:/var/www/backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_ENDPOINT=redis
      - REDIS_PORT=6379
      - DB_ENDPOINT=postgres
      - DB_PORT=5432
      - DB_NAME=db
      - DB_PASS=secret
      - DB_USER=devops
  postgres:
    image: postgres:14-alpine
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=devops
      - POSTGRES_DB=devops
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always